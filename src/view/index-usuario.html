<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuario</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">

    <!-- HEADER -->
    <div class="flex justify-between items-center p-4 border-b border-gray-700">
        <h1 class="text-xl font-bold">Panel Usuario</h1>

        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded transition">
            Cerrar sesión
        </button>
    </div>

    <!-- CONTENIDO -->
    <div class="p-6">
        <h1 class="text-2xl font-bold mb-4">HOLA MUNDO</h1>

        <p class="text-gray-300">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ut ullam, libero voluptas maxime quibusdam mollitia
            dolore nesciunt quas obcaecati, eos sit, reprehenderit aperiam quo ratione enim perferendis rerum. A, nulla?
        </p>
    </div>

    <script>
  const token = localStorage.getItem("token");

  // 🔐 VALIDACIÓN REAL (NO SOLO LOCALSTORAGE)
  if (!token) {
    window.location.href = "/";
  } else {
    fetch("/login/verify", {
      headers: {
        Authorization: "Bearer " + token
      }
    })
      .then(res => res.json())
      .then(data => {
        if (!data.ok || data.usuario.rol != 1) {
          localStorage.clear();
          window.location.href = "/";
        } else {
          // 🔥 sincronizar rol por seguridad
          localStorage.setItem("rol", data.usuario.rol);
        }
      })
      .catch(() => {
        localStorage.clear();
        window.location.href = "/";
      });
  }

  // 🚪 LOGOUT
  function logout() {
    localStorage.clear();
    window.location.href = "/";
  }
</script>

</body>

</html>
