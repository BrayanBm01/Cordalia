<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal</title>

  <!-- ✅ RUTA CORREGIDA -->
  <link rel="stylesheet" href="../css/login.css">

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat"
  style="background-image: url('/img/fondo-login.jpg');">

  <div
    class="relative w-full max-w-5xl bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">

    <!-- CÍRCULOS -->
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
    <div class="circle c5"></div>

    <!-- IZQUIERDA -->
    <div
      class="w-full md:w-1/2 flex items-center justify-center p-10 text-center text-white relative z-20 bg-black/40 backdrop-brightness-50">
      <div>
        <h1 class="text-4xl md:text-5xl font-bold text-white">
          ¡Bienvenido a tu portal!
        </h1>

        <p class="mt-4 text-white text-xl md:text-2xl font-medium">
          Ingresa a nuestras redes sociales para más información.
        </p>
      </div>
    </div>

    <!-- DERECHA -->
    <div class="w-full md:w-1/2 bg-white p-10 relative z-20 flex items-center justify-center">
      <div class="w-full max-w-sm min-h-[520px] flex flex-col justify-center">

        <!-- LOGIN -->
        <div id="loginForm" class="fade-slide show">
          <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Inicia sesión</h2>

          <form class="space-y-4">
            <input id="loginEmail" type="email" placeholder="Correo"
              class="w-full p-3 border border-blue-300 rounded-lg" required>

            <input id="loginPassword" type="password" placeholder="Contraseña"
              class="w-full p-3 border border-blue-300 rounded-lg" required>

            <div class="flex gap-3 pt-4">
              <button type="button" onclick="loginUser()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold">
                Login
              </button>

              <button type="button" onclick="showRegister()"
                class="w-full py-3 border border-blue-600 text-blue-600 rounded-lg font-semibold">
                Registrarse
              </button>
            </div>
          </form>
        </div>

        <!-- REGISTRO -->
        <div id="registerForm" class="fade-slide hidden">
          <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Crear cuenta</h2>

          <form class="space-y-4">
            <input id="registerNombre" type="text" placeholder="Nombre"
              class="w-full p-3 border border-blue-300 rounded-lg" required>

            <input id="registerEmail" type="email" placeholder="Correo"
              class="w-full p-3 border border-blue-300 rounded-lg" required>

            <p id="emailError" class="text-red-600 text-sm hidden">
              El correo debe ser @gmail.com
            </p>

            <input id="registerPassword" type="password" placeholder="Contraseña"
              class="w-full p-3 border border-blue-300 rounded-lg" required>

            <div class="flex gap-3 pt-4">
              <button type="button" onclick="showLogin()"
                class="w-full py-3 border border-blue-600 text-blue-600 rounded-lg">
                Volver
              </button>

              <button type="button" onclick="registerUser()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
                Registrar
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    // 🔒 VERIFICAR TOKEN CON BACKEND + ROL
    const token = localStorage.getItem("token");
    const rol = localStorage.getItem("rol");

    if (token) {
      fetch("/login/verify", {
        headers: {
          Authorization: "Bearer " + token
        }
      })
        .then(res => res.json())
        .then(data => {
          if (data.ok) {
            // 🔥 REDIRECCIÓN SEGÚN ROL
            if (rol == 0) {
              window.location.href = "/admin";
            } else {
              window.location.href = "/usuario";
            }
          } else {
            localStorage.removeItem("token");
            localStorage.removeItem("rol");
          }
        })
        .catch(() => {
          localStorage.removeItem("token");
          localStorage.removeItem("rol");
        });
    }

    function switchForm(show, hide) {
      hide.classList.remove("show");

      setTimeout(() => {
        hide.classList.add("hidden");
        show.classList.remove("hidden");
        show.classList.remove("show");
        void show.offsetWidth;
        show.classList.add("show");
      }, 200);
    }

    function showRegister() {
      switchForm(registerForm, loginForm);
    }

    function showLogin() {
      switchForm(loginForm, registerForm);
    }

    // ✅ LOGIN
    async function loginUser() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        alert("Completa todos los campos");
        return;
      }

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.ok) {
          // 🔥 GUARDAR TOKEN Y ROL
          localStorage.setItem("token", data.token);
          localStorage.setItem("rol", data.rol);

          alert(data.mensaje);

          // 🔥 REDIRECCIÓN POR ROL
          if (data.rol == 0) {
            window.location.href = "/admin";
          } else {
            window.location.href = "/usuario";
          }

        } else {
          alert(data.mensaje);
        }

      } catch (error) {
        console.error(error);
        alert("Error al conectar con el servidor");
      }
    }
  </script>
</body>

</html>
