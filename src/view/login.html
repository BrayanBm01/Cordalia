<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal</title>

  <link rel="stylesheet" href="../css/login.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ICONOS -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat px-4"
  style="background-image: url('/img/fondo-login.jpg');">

  <div
    class="relative w-full max-w-5xl bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">

    <!-- CÍRCULOS -->
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>
    <div class="circle c5"></div>

    <!-- IZQUIERDA -->
    <div
      class="w-full md:w-1/2 flex items-center justify-center p-8 md:p-10 text-center text-white relative z-20 bg-black/40 backdrop-brightness-50">

      <div>
        <h1 class="text-3xl md:text-5xl font-bold flex items-center justify-center gap-2">
          <i data-feather="map-pin"></i>
          Descubre Córdoba
        </h1>

        <p class="mt-4 text-lg md:text-2xl font-medium flex items-center justify-center gap-2">
          <i data-feather="compass"></i>
          Vive su cultura, historia y paisajes
        </p>

        <!-- EXTRA -->
        <div class="mt-6 text-sm md:text-base text-gray-200 flex flex-col items-center gap-2">
          <div class="flex items-center gap-2">
            <i data-feather="camera"></i>
            <span>Explora lugares únicos</span>
          </div>

          <div class="flex items-center gap-2">
            <i data-feather="sun"></i>
            <span>Disfruta experiencias inolvidables</span>
          </div>
        </div>
      </div>

    </div>

    <!-- DERECHA -->
    <div class="w-full md:w-1/2 bg-white p-6 md:p-10 relative z-20 flex items-center justify-center">
      <div class="w-full max-w-sm min-h-[520px] flex flex-col justify-center">

        <!-- LOGIN -->
        <div id="loginForm" class="fade-slide show">
          <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Inicia sesión</h2>

          <form class="space-y-4">

            <!-- EMAIL -->
            <div class="relative">
              <input id="loginEmail" type="email" placeholder="Correo"
                class="w-full p-3 pl-10 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                required>
              <i data-feather="mail" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>
            </div>

            <!-- PASSWORD -->
            <div class="relative">
              <input id="loginPassword" type="password" placeholder="Contraseña"
                class="w-full p-3 pl-10 pr-10 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                required>

              <i data-feather="lock" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>

              <button type="button" onclick="togglePassword('loginPassword', this)"
                class="absolute right-3 top-3.5 text-gray-500">
                <i data-feather="eye"></i>
              </button>
            </div>

            <div class="flex gap-3 pt-4 flex-col sm:flex-row">
              <button type="button" onclick="loginUser()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition">
                Login
              </button>

              <button type="button" onclick="showRegister()"
                class="w-full py-3 border border-blue-600 text-blue-600 rounded-lg font-semibold hover:bg-blue-50 transition">
                Registrarse
              </button>
            </div>
          </form>
        </div>

        <!-- REGISTRO -->
        <div id="registerForm" class="fade-slide hidden">
          <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Crear cuenta</h2>

          <form class="space-y-4">

            <!-- NOMBRE -->
            <div class="relative">
              <input id="registerNombre" type="text" placeholder="Nombre"
                class="w-full p-3 pl-10 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                required>
              <i data-feather="user" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>
            </div>

            <!-- EMAIL -->
            <div class="relative">
              <input id="registerEmail" type="email" placeholder="Correo"
                class="w-full p-3 pl-10 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                required>
              <i data-feather="mail" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>
            </div>

            <p id="emailError" class="text-red-600 text-sm hidden">
              El correo debe ser @gmail.com
            </p>

            <!-- PASSWORD -->
            <div class="relative">
              <input id="registerPassword" type="password" placeholder="Contraseña"
                class="w-full p-3 pl-10 pr-10 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                required>

              <i data-feather="lock" class="absolute left-3 top-3.5 w-5 h-5 text-gray-400"></i>

              <button type="button" onclick="togglePassword('registerPassword', this)"
                class="absolute right-3 top-3.5 text-gray-500">
                <i data-feather="eye"></i>
              </button>
            </div>

            <div class="flex gap-3 pt-4 flex-col sm:flex-row">
              <button type="button" onclick="showLogin()"
                class="w-full py-3 border border-blue-600 text-blue-600 rounded-lg hover:bg-blue-50 transition">
                Volver
              </button>

              <button type="button" onclick="registerUser()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                Registrar
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>

  </div>

  <script>
    feather.replace();

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector("i");

      if (input.type === "password") {
        input.type = "text";
        icon.setAttribute("data-feather", "eye-off");
      } else {
        input.type = "password";
        icon.setAttribute("data-feather", "eye");
      }

      feather.replace();
    }
  </script>

  <script src="/script/login.js"></script>
</body>

</html>
