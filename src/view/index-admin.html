<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white p-6">

    <h1 class="text-3xl font-bold mb-6">Panel de Administración</h1>

    <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded mb-6">
        Cerrar sesión
    </button>

    <!-- FORM CREAR / EDITAR -->
    <div class="bg-gray-800 p-4 rounded mb-6">
        <h2 class="text-xl mb-4">Crear / Editar Usuario</h2>

        <input id="nombre" placeholder="Nombre" class="block mb-2 p-2 text-black w-full">
        <input id="email" placeholder="Email" class="block mb-2 p-2 text-black w-full">
        <input id="password" placeholder="Password" class="block mb-2 p-2 text-black w-full">

        <select id="rol" class="block mb-4 p-2 text-black w-full">
            <option value="0">Admin</option>
            <option value="1">Usuario</option>
        </select>

        <button onclick="guardarUsuario()" class="bg-green-500 px-4 py-2 rounded">
            Guardar
        </button>
    </div>

    <!-- TABLA -->
    <table class="w-full bg-gray-800 rounded">
        <thead>
            <tr class="bg-gray-700">
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
    </table>

    <script>
        let editandoId = null;

        // 🔐 VERIFICAR TOKEN Y ROL (CORRECTO Y ESTABLE)
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "/";
        } else {
            fetch("/login/verify", {
                headers: {
                    Authorization: "Bearer " + token
                }
            })
                .then(res => res.json())
                .then(data => {
                    console.log("VERIFY:", data); // 👈 DEBUG

                    if (!data.ok) {
                        window.location.href = "/";
                        return;
                    }

                    const rol = Number(data.usuario?.rol); // 🔥 aseguramos número

                    if (rol !== 0) {
                        alert("No tienes permisos");
                        window.location.href = "/";
                        return;
                    }

                    // ✅ SOLO ADMIN
                    cargarUsuarios();
                })
                .catch(() => {
                    window.location.href = "/";
                });
        }

        // 🚀 CARGAR USUARIOS
        async function cargarUsuarios() {
            try {
                const res = await fetch("/api/usuarios", {
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                const data = await res.json();

                const tabla = document.getElementById("tablaUsuarios");
                tabla.innerHTML = "";

                data.forEach(u => {
                    tabla.innerHTML += `
            <tr class="text-center border-t border-gray-700">
                <td>${u.id}</td>
                <td>${u.nombre}</td>
                <td>${u.email}</td>
                <td>${u.rol_id}</td>
                <td>
                    <button onclick='editar(${JSON.stringify(u)})' class="bg-yellow-500 px-2 py-1 rounded">Editar</button>
                    <button onclick='eliminar(${u.id})' class="bg-red-500 px-2 py-1 rounded">Eliminar</button>
                </td>
            </tr>
            `;
                });

            } catch (error) {
                console.error("Error cargando usuarios:", error);
            }
        }

        // ✏️ EDITAR
        function editar(usuario) {
            editandoId = usuario.id;

            document.getElementById("nombre").value = usuario.nombre;
            document.getElementById("email").value = usuario.email;
            document.getElementById("rol").value = usuario.rol_id;
        }

        // 💾 GUARDAR
        async function guardarUsuario() {
            const nombre = document.getElementById("nombre").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const rol = document.getElementById("rol").value;

            const body = { nombre, email, rol_id: Number(rol) };

            if (password) body.password = password;

            let url = "/api/usuarios";
            let method = "POST";

            if (editandoId) {
                url += "/" + editandoId;
                method = "PUT";
            }

            try {
                const res = await fetch(url, {
                    method,
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer " + token
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();
                alert(data.mensaje);

                limpiar();
                cargarUsuarios();

            } catch (error) {
                console.error("Error guardando:", error);
            }
        }

        // 🗑️ ELIMINAR
        async function eliminar(id) {
            if (!confirm("¿Eliminar usuario?")) return;

            try {
                const res = await fetch("/api/usuarios/" + id, {
                    method: "DELETE",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                const data = await res.json();
                alert(data.mensaje);

                cargarUsuarios();

            } catch (error) {
                console.error("Error eliminando:", error);
            }
        }

        // 🧹 LIMPIAR
        function limpiar() {
            editandoId = null;
            document.getElementById("nombre").value = "";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        }

        // 🚪 LOGOUT
        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>

</body>

</html>
