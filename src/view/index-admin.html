<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen">

    <!-- HEADER -->
    <div class="flex flex-col md:flex-row justify-between items-center p-6 border-b border-gray-700">
        <h1 class="text-2xl md:text-3xl font-bold mb-4 md:mb-0">
            Panel de Administración
        </h1>

        <button onclick="logout()" 
            class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded transition">
            Cerrar sesión
        </button>
    </div>

    <div class="p-4 md:p-6 max-w-6xl mx-auto">

        <!-- FORM -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">
                Crear / Editar Usuario
            </h2>

            <div class="grid md:grid-cols-2 gap-4">
                <input id="nombre" placeholder="Nombre"
                    class="p-2 rounded bg-gray-200 text-black w-full">

                <input id="email" placeholder="Email"
                    class="p-2 rounded bg-gray-200 text-black w-full">

                <input id="password" placeholder="Password"
                    class="p-2 rounded bg-gray-200 text-black w-full">

                <select id="rol"
                    class="p-2 rounded bg-gray-200 text-black w-full">
                    <option value="0">Admin</option>
                    <option value="1" selected>Usuario</option>
                </select>
            </div>

            <div class="mt-4 flex gap-3">
                <button onclick="guardarUsuario()"
                    class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded transition">
                    Guardar
                </button>

                <button onclick="limpiar()"
                    class="bg-gray-500 hover:bg-gray-600 px-4 py-2 rounded transition">
                    Limpiar
                </button>
            </div>
        </div>

        <!-- TABLA -->
        <div class="bg-gray-800 rounded-xl shadow-lg p-4 overflow-x-auto">
            <table class="w-full text-sm md:text-base">
                <thead>
                    <tr class="bg-gray-700 text-gray-200">
                        <th class="p-2">ID</th>
                        <th class="p-2">Nombre</th>
                        <th class="p-2">Email</th>
                        <th class="p-2">Rol</th>
                        <th class="p-2">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>

    </div>

    <script>
        let editandoId = null;
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "/";
        } else {
            fetch("/login/verify", {
                headers: { Authorization: "Bearer " + token }
            })
            .then(res => res.json())
            .then(data => {
                if (!data.ok || Number(data.usuario?.rol) !== 0) {
                    alert("No tienes permisos");
                    window.location.href = "/";
                    return;
                }
                cargarUsuarios();
            })
            .catch(() => window.location.href = "/");
        }

        async function cargarUsuarios() {
            try {
                const res = await fetch("/api/usuarios", {
                    headers: { Authorization: "Bearer " + token }
                });

                const data = await res.json();
                const tabla = document.getElementById("tablaUsuarios");
                tabla.innerHTML = "";

                data.forEach(u => {
                    tabla.innerHTML += `
                    <tr class="text-center border-t border-gray-700 hover:bg-gray-700">
                        <td class="p-2">${u.id}</td>
                        <td class="p-2">${u.nombre}</td>
                        <td class="p-2">${u.email}</td>
                        <td class="p-2">${u.rol_id == 0 ? 'Admin' : 'Usuario'}</td>
                        <td class="p-2 flex flex-col md:flex-row gap-2 justify-center">
                            <button onclick='editar(${JSON.stringify(u)})'
                                class="bg-yellow-500 hover:bg-yellow-600 px-2 py-1 rounded">
                                Editar
                            </button>
                            <button onclick='eliminar(${u.id})'
                                class="bg-red-500 hover:bg-red-600 px-2 py-1 rounded">
                                Eliminar
                            </button>
                        </td>
                    </tr>`;
                });

            } catch (error) {
                console.error("Error cargando usuarios:", error);
            }
        }

        function editar(usuario) {
            editandoId = usuario.id;
            document.getElementById("nombre").value = usuario.nombre;
            document.getElementById("email").value = usuario.email;
            document.getElementById("rol").value = usuario.rol_id;
        }

        async function guardarUsuario() {
            const nombre = document.getElementById("nombre").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const rol = document.getElementById("rol").value;

            if (!nombre || !email || !rol) {
                alert("Completa nombre, email y rol");
                return;
            }

            const body = {
                nombre,
                email,
                rol_id: Number(rol)
            };

            if (password) body.password = password;

            let url = "/api/usuarios";
            let method = "POST";

            if (editandoId) {
                url = `/api/usuarios/${editandoId}`;
                method = "PUT";
            }

            try {
                const res = await fetch(url, {
                    method,
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer " + token
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.mensaje || "Error");
                    return;
                }

                alert(data.mensaje || "Guardado correctamente");

                limpiar();
                cargarUsuarios();

            } catch (error) {
                console.error("Error guardando:", error);
            }
        }

        async function eliminar(id) {
            if (!confirm("¿Eliminar usuario?")) return;

            try {
                const res = await fetch("/api/usuarios/" + id, {
                    method: "DELETE",
                    headers: { Authorization: "Bearer " + token }
                });

                const data = await res.json();
                alert(data.mensaje);

                cargarUsuarios();

            } catch (error) {
                console.error("Error eliminando:", error);
            }
        }

        function limpiar() {
            editandoId = null;
            document.getElementById("nombre").value = "";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
            document.getElementById("rol").value = "1";
        }

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }
    </script>

</body>
</html>
